name = "skillgarden"
main = "worker.js"
compatibility_date = "2026-09-01"

# The public website: built into ./public before every deploy.
[build]
command = "node build-site.mjs"

[assets]
directory = "./public"
binding = "ASSETS"
# Unknown paths get public/404.html with status 404 (written by pages.mjs).
not_found_handling = "404-page"

[vars]
REPO = "Gipsonkj/skillgarden"
REF = "main"

# Secrets (not in this file): npx wrangler secret put ACCESS_KEYS
# Optional:                   npx wrangler secret put GITHUB_TOKEN

# Feedback notes from /skillgarden:feedback and send_feedback, kept 90 days until the owner's Mac
# collects them. The Mac reads them with the FEEDBACK_KEY secret: npx wrangler secret put FEEDBACK_KEY
[[kv_namespaces]]
binding = "FEEDBACK"
id = "8a70bb6d493a40e394aabef9c0fd6a96"
