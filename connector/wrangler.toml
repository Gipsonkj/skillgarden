name = "skillgarden"
main = "worker.js"
compatibility_date = "2026-09-01"

# The public website: built into ./public before every deploy.
[build]
command = "node build-site.mjs"

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
REPO = "Gipsonkj/skillgarden"
REF = "main"

# Secrets (not in this file): npx wrangler secret put ACCESS_KEYS
# Optional:                   npx wrangler secret put GITHUB_TOKEN
