    if (window.SG_PUBLIC) {
      const r = await fetch(`/lib/${s.local}.zip`);
      if (!r.ok) throw new Error("zip");
      const src = await window.JSZip.loadAsync(await r.arrayBuffer());
      const folder = zip.folder(s.name.replace(/[^\w.-]+/g, "-"));
      await Promise.all(Object.values(src.files).filter((f) => !f.dir).map(async (f) => folder.file(f.name, await f.async("uint8array"))));
      return;
    }
    const files = await fetch(`/library/list?path=${encodeURIComponent(s.local)}`).then((r) => r.ok ? r.json() : Promise.reject(new Error("list")));
    const total = files.reduce((a, f) => a + N(f.size), 0);
    if (total > 40e6) throw Object.assign(new Error("big"), { big: true });
    const folder = zip.folder(s.name.replace(/[^\w.-]+/g, "-"));
    await Promise.all(files.map(async (f) => { const r = await fetch(`/library/raw?path=${encodeURIComponent(s.local + "/" + f.path)}`); if (r.ok) folder.file(f.path, await r.arrayBuffer()); }));
  }
  const readme = (lines) => `Skill Garden bundle\n\nInstall in Claude Code:  unzip this file, then move each folder into ~/.claude/skills/\nInstall in claude.ai:    zip each folder on its own and upload it in Settings → Capabilities → Skills\n\nEvery skill keeps its author's license (see LICENSE files and CREDITS.md inside each folder).\nRead third-party scripts before you run them.\n\nIn this bundle:\n${lines.join("\n")}\n`;
  async function downloadItems(items, filename) {
    if (!window.JSZip) { toast("The zip maker didn't load. Check your connection and reload.", "bad"); return; }
    const zip = new window.JSZip(); const lines = []; const skipped = [];
    toast("Packing your download…");
    for (const it of items) {
      const c = craftById(it.topic); if (!c) continue;
      if (it.kind === "super") { if (!c.live || !c.live.content) { skipped.push(c.id); continue; } addSkill(zip.folder(c.id), c.live); lines.push(`- ${c.id} (super skill v${N(c.live.version)}, ${c.name})`); }
      else { const s = c.skills.find((x) => x.name === it.name); if (!s || !s.local) { skipped.push(it.name); continue; } try { await addSubTo(zip, c, s); lines.push(`- ${s.name} (${s.license}, ${s.repo})`); } catch (e) { skipped.push(it.name + (e.big ? " (too large, use the craft library zip)" : "")); } }
    }
    if (!lines.length) { toast("Nothing could be packed. " + (skipped.length ? "Skipped: " + skipped.join(", ") : ""), "bad"); return; }
    if (items.length > 1) zip.file("README.txt", readme(lines));
    await download(filename, await zip.generateAsync({ type: "blob" }));
    toast(skipped.length ? `Downloaded. Skipped: ${skipped.join(", ")}` : `Downloaded ${plural(lines.length, "skill")}.`, skipped.length ? "bad" : undefined);
  }

  /* bundle */
  function saveBundle() { store.set("bundle", EX.bundle); renderBundle(); }
  function renderBundle() {
    const n = EX.bundle.length;
    const fab = $("#bundleFab"); fab.hidden = !n; $("#bundleCount").textContent = String(n);
    $("#sheet").innerHTML = `<div class="sheet-head"><div><h3 style="font-size:18px">Your bundle</h3><p>${n ? `${plural(n, "skill")}, packed into one zip with a README and every license.` : "Add super skills and sub-skills to pack them together."}</p></div><button class="icon-btn" data-act="close-overlays" aria-label="Close">✕</button></div>
      <ul>${EX.bundle.map((b, i) => { const c = craftById(b.topic); return `<li><span class="k">${b.kind === "super" ? "Super" : "Sub"}</span><strong>${esc(b.kind === "super" ? b.topic : b.name)}</strong><span class="muted" style="font-size:12.5px">${esc(c ? c.name : "")}</span><button class="btn ghost small" data-act="bundle-rm" data-id="${i}" aria-label="Remove">✕</button></li>`; }).join("")}</ul>
      <div class="sheet-foot"><button class="link" data-act="bundle-clear"${n ? "" : " disabled"}>Clear</button><button class="btn primary" data-act="bundle-dl"${n ? "" : " disabled"}>Download bundle (.zip)</button></div>`;
  }
  function toggleBundle(kind, topic, name) {
    const i = EX.bundle.findIndex((b) => b.kind === kind && b.topic === topic && (kind === "super" || b.name === name));
    if (i >= 0) EX.bundle.splice(i, 1); else { EX.bundle.push(kind === "super" ? { kind, topic } : { kind, topic, name }); const f = $("#bundleFab"); f.classList.remove("pulse"); void f.offsetWidth; f.classList.add("pulse"); }
    saveBundle(); $("#ex")._h = null; render();
  }

  /* command palette */
  function palIndex() {
    const out = [
      { k: "Action", t: "Download all super skills", d: "One zip with every craft's router and guides", run: () => downloadItems(crafts().map((c) => ({ kind: "super", topic: c.id })), "skill-garden-super-skills.zip") },
      { k: "Action", t: "Open your bundle", d: `${plural(EX.bundle.length, "item")}`, run: () => openSheet() },
      { k: "Action", t: "Switch light or dark", d: "Theme", run: () => toggleTheme() },
      { k: "Go to", t: "Review", d: "Changes the scout proposes", run: () => goView("review") },
      { k: "Go to", t: "My skills", d: "Versions, history and tests", run: () => goView("skills") },
      { k: "Go to", t: "Scout log", d: "What the weekly scout looked at", run: () => goView("log") },
    ];
    for (const c of crafts()) {
      out.push({ k: "Craft", t: c.name, d: c.blurb || "", run: () => openCraft(c.id) });
      for (const s of c.skills) out.push({ k: "Sub-skill", t: s.name, d: `in ${c.name} · #${s.rank} · ${s.purpose}`, run: () => { openCraft(c.id); setTimeout(() => previewSub(c, s), 60); } });
    }
    return out;
  }
  function palRender() {
    const q = $("#palInput").value.trim().toLowerCase();
    const all = palIndex();
    let items;
    if (!q) items = all.filter((x) => x.k !== "Sub-skill").slice(0, 40);
    else {
      const words = q.split(/\s+/);
      items = all.map((x) => { const hay = (x.t + " " + x.d).toLowerCase(), tl = x.t.toLowerCase(); if (!words.every((w) => hay.includes(w))) return null; return { x, s: (tl === q ? 0 : tl.startsWith(q) ? 1 : tl.includes(q) ? 2 : 3) + (x.k === "Sub-skill" ? 0.5 : 0) }; }).filter(Boolean).sort((a, b) => a.s - b.s).slice(0, 40).map((r) => r.x);
    }
    EX.palItems = items; EX.palSel = Math.min(EX.palSel, Math.max(0, items.length - 1));
    $("#palList").innerHTML = items.length ? items.map((x, i) => `<li role="option" id="pal-${i}" data-act="pal-pick" data-id="${i}" aria-selected="${i === EX.palSel}"><span class="k">${esc(x.k)}</span><strong>${esc(x.t)}</strong><span class="d">${esc(x.d)}</span></li>`).join("") : `<li><span class="d">No match. Try fewer words.</span></li>`;
    $("#palInput").setAttribute("aria-activedescendant", items.length ? "pal-" + EX.palSel : "");
  }
  function openPalette() { closeOverlays(); const p = $("#palette"); p.classList.add("on"); p.setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on"); const i = $("#palInput"); i.value = ""; EX.palSel = 0; palRender(); i.focus(); }
  function palPick(i) { const x = EX.palItems[i]; if (!x) return; closeOverlays(); x.run(); }
  function openSheet() { closeOverlays(); renderBundle(); const s = $("#sheet"); s.classList.add("on"); s.setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on"); }

  /* navigation: #/ is the catalog, #/c/<id> a craft page, so back and forward work */
  function goView(v) { if (window.SG_PUBLIC) v = "explore"; S.editing = null; S.noteEditing = null; S.view = v; if (v !== "explore" && location.hash.startsWith("#/")) history.replaceState(null, "", location.pathname + location.search); render(); window.scrollTo({ top: 0 }); }
  function openCraft(id) { if (window.SG_PUBLIC) return go(craftUrl(id)); if (location.hash !== "#/c/" + id) location.hash = "#/c/" + id; else onHash(); }
  // Website addresses: /explore/, /crafts/<id>/, /chains/<id>/, /guides/<craft>/<guide>/ (the craft with that guide open).
  function pathRoute(p = location.pathname) {
    let m;
    EX.topic = null; EX.chain = null; EX.guide = null; EX.guideShown = null; EX.subFilter = "all"; S.view = "explore";
    if ((m = p.match(/^\/crafts\/([\w-]+)\/?$/))) EX.topic = m[1];
    else if ((m = p.match(/^\/chains\/([\w-]+)\/?$/))) EX.chain = m[1];
    else if ((m = p.match(/^\/guides\/([\w-]+)\/([\w.-]+)\/?$/))) { EX.topic = m[1]; EX.guide = `references/${m[2]}.md`; }
  }
  function go(path) {
    EX.navigated = true;
    if (location.pathname !== path || location.hash) history.pushState(null, "", path);
    pathRoute(); closeOverlays(true); render(); window.scrollTo({ top: 0 });
  }
  // Old #/ links on the website become real addresses.
  function hashToPath() {
    const m = location.hash.match(/^#\/c\/([\w-]+)/), k = location.hash.match(/^#\/chain\/([\w-]+)/);
    EX.navigated = true;
    history.replaceState(null, "", m ? craftUrl(m[1]) : k ? chainUrl(k[1]) : "/explore/");
  }
  if (window.SG_PUBLIC) window.addEventListener("popstate", () => { EX.navigated = true; pathRoute(); closeOverlays(true); render(); });
  function onHash() {
    if (window.SG_PUBLIC) { if (location.hash.startsWith("#/")) { hashToPath(); pathRoute(); closeOverlays(true); render(); } return; }
    const m = location.hash.match(/^#\/c\/([\w-]+)/);
    const k = location.hash.match(/^#\/chain\/([\w-]+)/);
    if (location.hash.startsWith("#/")) { S.view = "explore"; EX.topic = m ? m[1] : null; EX.chain = k ? k[1] : null; EX.subFilter = "all"; closeOverlays(); render(); if (!m && !k) window.scrollTo({ top: 0 }); }
  }
  window.addEventListener("hashchange", onHash);

  function toggleTheme() {
    const cur = document.documentElement.dataset.theme || "light";
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next; store.set("theme", next); gardenColors = null;
  }
  { const th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th; }

  /* the garden: one stem per craft, height from its ranked skills, bloom when something is trending */
  let gardenColors = null;
  function startGarden() {
    const cv = $("#garden"); if (!cv || cv._on) return; cv._on = true;
    const ctx = cv.getContext("2d");
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let W = 0, H = 0, hover = -1, raf = 0;
    const seeds = Array.from({ length: 26 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.6, v: 0.00004 + Math.random() * 0.00008, p: i }));
    const size = () => { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); if (still) draw(0); };
    const colors = () => { if (gardenColors) return gardenColors; const cs = getComputedStyle(document.documentElement); const g = (n) => cs.getPropertyValue(n).trim(); return (gardenColors = { accent: g("--accent"), ink3: g("--ink-3"), line: g("--line"), pollen: g("--pollen"), dark: document.documentElement.dataset.theme === "dark" }); };
    const stems = () => crafts().map((c) => ({ id: c.id, name: c.name, n: c.skills.length || refsOf(c).length, tr: c.skills.filter((s) => s.trending).length, hue: N(c.hue) }));
    function draw(t) {
      if (!cv.isConnected) { cancelAnimationFrame(raf); return; }
      const col = colors(), list = stems(), n = list.length; if (!n) return;
      ctx.clearRect(0, 0, W, H);
      const base = H - 34, top = 70, mx = Math.max(...list.map((s) => s.n), 1);
      ctx.font = "500 10px 'IBM Plex Mono', monospace"; ctx.fillStyle = col.ink3; ctx.strokeStyle = col.line; ctx.lineWidth = 1;
      for (const v of [10, 20, 30]) { if (v > mx + 4) continue; const y = base - (v / mx) * (base - top); ctx.globalAlpha = 0.6; ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.moveTo(14, y); ctx.lineTo(W - 14, y); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.fillText(String(v), W - 30, y - 4); }
      ctx.beginPath(); ctx.moveTo(14, base); ctx.lineTo(W - 14, base); ctx.stroke();
      for (const p of seeds) { const y = (((p.y - t * p.v) % 1) + 1) % 1; ctx.globalAlpha = 0.35 * Math.sin(y * Math.PI); ctx.fillStyle = col.pollen; ctx.beginPath(); ctx.arc(14 + p.x * (W - 28), top - 40 + y * (base - top + 40), p.r, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
      const gap = (W - 56) / Math.max(1, n - 1);
      list.forEach((s, i) => {
        const x = 28 + i * gap, h = (s.n / mx) * (base - top), on = i === hover;
        const sway = still ? 0 : Math.sin(t * 0.0009 + i * 0.63) * (4 + h * 0.035) + (on ? 0 : 0);
        const tx = x + sway, ty = base - h;
        const hueCol = `hsl(${s.hue} ${col.dark ? "60% 64%" : "50% 42%"})`;
        ctx.strokeStyle = on ? hueCol : col.accent; ctx.globalAlpha = hover < 0 || on ? 0.95 : 0.35; ctx.lineWidth = on ? 2.6 : 1.7; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x, base - h * 0.55, tx, ty); ctx.stroke();
        for (const [f, side] of [[0.38, -1], [0.62, 1]]) {
          if (h < 40) continue;
          const lx = x + (tx - x) * f * f, ly = base - h * f;
          ctx.save(); ctx.translate(lx, ly); ctx.rotate(side * 0.9 + sway * 0.02); ctx.fillStyle = on ? hueCol : col.accent; ctx.globalAlpha *= 0.55;
          ctx.beginPath(); ctx.ellipse(side * 7, 0, 7, 2.6, 0, 0, 7); ctx.fill(); ctx.restore();
        }
        ctx.globalAlpha = hover < 0 || on ? 1 : 0.45;
        const hot = s.tr >= 4, r = 2.6 + Math.min(4, s.tr * 0.6) + (on ? 2 : 0);
        if (hot) { ctx.fillStyle = col.pollen; ctx.shadowColor = col.pollen; ctx.shadowBlur = on ? 18 : 10; }
        else { ctx.fillStyle = on ? hueCol : col.accent; ctx.shadowBlur = 0; }
        ctx.beginPath(); ctx.arc(tx, ty, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      });
      if (!still) raf = requestAnimationFrame(draw);
    }
    function pick(ev) {
      const list = stems(), n = list.length; const r = cv.getBoundingClientRect(); const x = ev.clientX - r.left;
      const gap = (W - 56) / Math.max(1, n - 1); const i = Math.round((x - 28) / gap);
      return i >= 0 && i < n && Math.abs(28 + i * gap - x) < gap * 0.6 ? i : -1;
    }
    cv.addEventListener("pointermove", (ev) => {
      const i = pick(ev); if (i === hover) return; hover = i; const s = stems()[i];
      $("#gcName").textContent = s ? s.name : "Point at a stem"; $("#gcNum").textContent = s ? `${s.n}${s.tr ? `, ${s.tr} trending` : ""}` : "—";
      cv.style.cursor = s ? "pointer" : "crosshair"; if (still) draw(0);
    });
    cv.addEventListener("pointerleave", () => { hover = -1; $("#gcName").textContent = "Point at a stem"; $("#gcNum").textContent = "—"; if (still) draw(0); });
    cv.addEventListener("click", (ev) => { const s = stems()[pick(ev)]; if (s) openCraft(s.id); });
    new ResizeObserver(size).observe(cv);
    size(); if (!still) raf = requestAnimationFrame(draw);
  }

  async function exploreAct(act, el) {
    const id = el.dataset.id;
    switch (act) {
      case "ex-home": if (window.SG_PUBLIC && el.classList.contains("brand")) { location.href = "/"; return true; } if (window.SG_PUBLIC) { go("/explore/"); return true; } if (location.hash !== "#/") location.hash = "#/"; else onHash(); return true;
      case "ex-topic": openCraft(id); return true;
      case "ex-chain": if (window.SG_PUBLIC) go(chainUrl(id)); else location.hash = "#/chain/" + id; return true;
      case "dl-chain": { const x = (EX.chains || []).find((c) => c.id === id); if (x) await downloadChain(x); return true; }
      case "ex-cat": EX.cat = id; render(); return true;
      case "ex-cat-home": EX.cat = id; if (window.SG_PUBLIC) go("/explore/"); else location.hash = "#/"; setTimeout(() => { const c = $("#crafts"); if (c) c.scrollIntoView({ behavior: "smooth" }); }, 80); return true;
      case "ex-scroll": { const c = $("#crafts"); if (c) c.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return true; }
      case "ex-sub": EX.subFilter = id; render(); return true;
      case "ex-sort": EX.sort = EX.sort === "stars" ? "rank" : "stars"; render(); return true;
      case "ex-install": EX.install = id; render(); return true;
      case "copy-text": try { await navigator.clipboard.writeText(el.dataset.text); toast("Copied."); } catch { toast("Copying isn't allowed here. Select the text instead.", "bad"); } return true;
      case "pv-ref": { const c = craftById(id); if (c) previewRef(c, el.dataset.path); return true; }
      case "pv-router": { const c = craftById(id); if (c) previewRouter(c); return true; }
      case "pv-sub": { const c = craftById(id); const s = c && c.skills.find((x) => x.name === el.dataset.name); if (s) previewSub(c, s); return true; }
      case "dl-super": await downloadItems([{ kind: "super", topic: id }], `${id}.zip`); return true;
      case "dl-sub": { const c = craftById(id); await downloadItems([{ kind: "sub", topic: id, name: el.dataset.name }], `subskill-${el.dataset.name.replace(/[^\w.-]+/g, "-")}.zip`); if (c) setTimeout(() => toast(`That was one sub-skill of ${c.name}. The ${c.id} super skill already carries it with every other guide.`), 1600); return true; }
      case "dl-all-super": await downloadItems(crafts().map((c) => ({ kind: "super", topic: c.id })), "skill-garden-super-skills.zip"); return true;
      case "bundle-toggle": toggleBundle(el.dataset.kind, el.dataset.topic, el.dataset.name); return true;
      case "bundle-open": openSheet(); return true;
      case "bundle-rm": EX.bundle.splice(+id, 1); saveBundle(); $("#ex") && ($("#ex")._h = null); render(); return true;
      case "bundle-clear": EX.bundle = []; saveBundle(); $("#ex") && ($("#ex")._h = null); render(); return true;
      case "bundle-dl": await downloadItems(EX.bundle, "skill-garden-bundle.zip"); return true;
      case "close-overlays": closeOverlays(); return true;
      case "palette": openPalette(); return true;
      case "pal-pick": palPick(+id); return true;
      case "theme": toggleTheme(); return true;
    }
    return false;
  }
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "exq") { EX.q = ev.target.value; setHTML($("#exGrid"), gridHtml(crafts())); }
    if (ev.target.id === "palInput") { EX.palSel = 0; palRender(); }
  });
  document.addEventListener("keydown", (ev) => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); $("#palette").classList.contains("on") ? closeOverlays() : openPalette(); return; }
    if (ev.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); openPalette(); return; }
    if (ev.key === "Escape" && $("#scrim").classList.contains("on")) { closeOverlays(); return; }
    if (ev.target.id === "palInput") {
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); const n = EX.palItems.length; if (!n) return; EX.palSel = (EX.palSel + (ev.key === "ArrowDown" ? 1 : n - 1)) % n; palRender(); const li = $("#pal-" + EX.palSel); if (li) li.scrollIntoView({ block: "nearest" }); }
      if (ev.key === "Enter") { ev.preventDefault(); palPick(EX.palSel); }
    }
  });
  renderBundle();
  if (!window.SG_PUBLIC && location.hash.startsWith("#/")) onHash();

  /* ---------- boot ---------- */
  if (window.SG_PUBLIC) {
    document.documentElement.classList.add("sg-public");
    if (location.hash.startsWith("#/")) hashToPath();
    pathRoute();
    // A page the build pre-rendered (connector/prerender.mjs) keeps its HTML until the data is in, then the app takes it over.
    if ($("#view").hasAttribute("data-pre")) { mounted = "explore"; EX.hydrating = true; document.documentElement.classList.add("pre"); }
    // The build's pre-render step drives the page through this (only with ?prerender in the address).
    if (/[?&]prerender\b/.test(location.search)) window.__sg = {
      ready: () => !!(EX.catalogTried && S.loaded.topics && EX.chains),
      route(path) {
        // The path goes straight to the router: Chrome ignores history changes past ~200 in a few seconds.
        pathRoute(path); closeOverlays(true); render();
        return { view: $("#view").innerHTML, drawer: $("#drawer").classList.contains("on") ? $("#drawer").innerHTML : "" };
      },
    };
  }
  render();
  (async () => {
    const c = window.claude;
    if (!c || typeof c.use !== "function") { S.dbMissing = true; render(); return; }
    const db = await c.use("db");
    if (!db) { S.dbMissing = true; render(); return; }
    S.db = db;
    const fail = (key) => () => { S.loaded[key] = true; render(); };
    db.collection("topics").onSnapshot((snap) => { S.topics = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0) || String(a.name).localeCompare(String(b.name))); S.loaded.topics = true; render(); }, fail("topics"));
    db.collection("candidates").orderBy("createdAt", "desc").limit(300).onSnapshot((snap) => { S.candidates = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.candidates = true; render(); }, fail("candidates"));
    db.collection("inbox").orderBy("addedAt", "desc").limit(1000).onSnapshot((snap) => { S.inbox = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.inbox = true; render(); }, fail("inbox"));
    db.collection("runs").orderBy("startedAt", "desc").limit(30).onSnapshot((snap) => { S.runs = snap.docs.map((d) => ({ id: d.id, ...d.data() })); S.loaded.runs = true; render(); }, fail("runs"));
    db.doc("settings/main").onSnapshot((snap) => { S.settings = snap.exists ? snap.data() : null; S.loaded.settings = true; render(); }, fail("settings"));
    db.collection("radar").orderBy("takenAt", "desc").limit(1).onSnapshot((snap) => { const d = snap.docs[0]; S.radar = d ? { id: d.id, ...d.data() } : null; S.loaded.radar = true; render(); }, fail("radar"));
    render();
    c.use("user").then(async (u) => { S.user = u; if (u) { const w = await u.can("data.write"); if (w === false) { S.canWrite = false; const b = $("#banner"); b.hidden = false; b.textContent = "You can read this garden but not change it. Ask its owner for edit access."; } } render(); });
    c.use("downloads").then((d) => { S.downloads = d; });
    c.use("mcp").then((m) => { S.mcp = m; render(); });
    c.use("media").then((m) => { S.media = m || null; render(); }).catch(() => {});
  })();
})();
</script>
