<title>Skill Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap" rel="stylesheet">
<style>
/* Design read: a product catalog and workshop for Claude power users. Botanical instrument:
   herbarium labels meet lab readouts. One jade accent; pollen only marks trending. OKLCH tokens. */
:root {
  --ground: oklch(0.976 0.005 160);
  --surface: oklch(0.956 0.008 160);
  --raised: oklch(0.996 0.002 160);
  --ink: oklch(0.21 0.018 165);
  --ink-2: oklch(0.41 0.018 165);
  --ink-3: oklch(0.55 0.016 165);
  --line: oklch(0.885 0.011 160);
  --line-2: oklch(0.925 0.009 160);
  --accent: oklch(0.5 0.1 165);
  --accent-ink: oklch(0.99 0.01 165);
  --accent-soft: oklch(0.925 0.04 165);
  --bloom: oklch(0.58 0.12 65);
  --bloom-soft: oklch(0.94 0.05 85);
  --pollen: oklch(0.8 0.15 88);
  --good: oklch(0.52 0.12 150);
  --good-soft: oklch(0.93 0.05 150);
  --bad: oklch(0.55 0.15 35);
  --bad-soft: oklch(0.93 0.04 35);
  --tie: oklch(0.58 0.01 160);
  --add: oklch(0.93 0.05 150);
  --del: oklch(0.93 0.04 35);
  --tl: 34%;
  --tbg: 93%;
  --glass: oklch(0.976 0.005 160 / 0.78);
  --shadow: 0 1px 2px oklch(0.2 0.02 165 / 0.06), 0 8px 24px -12px oklch(0.2 0.02 165 / 0.22);
  --shadow-lg: 0 2px 6px oklch(0.2 0.02 165 / 0.08), 0 30px 60px -24px oklch(0.2 0.02 165 / 0.35);
  --ease: cubic-bezier(0.23, 1, 0.32, 1);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: oklch(0.165 0.012 170); --surface: oklch(0.195 0.013 170); --raised: oklch(0.222 0.014 170);
  --ink: oklch(0.945 0.008 160); --ink-2: oklch(0.77 0.015 160); --ink-3: oklch(0.6 0.015 160);
  --line: oklch(0.32 0.014 170); --line-2: oklch(0.265 0.013 170);
  --accent: oklch(0.79 0.12 165); --accent-ink: oklch(0.18 0.03 165); --accent-soft: oklch(0.31 0.05 165);
  --bloom: oklch(0.83 0.12 80); --bloom-soft: oklch(0.32 0.05 80); --pollen: oklch(0.86 0.15 92);
  --good: oklch(0.78 0.13 150); --good-soft: oklch(0.3 0.05 150); --bad: oklch(0.74 0.13 35); --bad-soft: oklch(0.3 0.05 35);
  --tie: oklch(0.62 0.01 160); --add: oklch(0.3 0.05 150); --del: oklch(0.3 0.05 35); --tl: 76%; --tbg: 17%;
  --glass: oklch(0.165 0.012 170 / 0.72);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.4), 0 10px 26px -12px oklch(0 0 0 / 0.6);
  --shadow-lg: 0 2px 6px oklch(0 0 0 / 0.4), 0 34px 70px -26px oklch(0 0 0 / 0.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 400 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 620; letter-spacing: -.01em; text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 0 72px; }
@media (max-width: 520px) { .app { padding-inline: 16px; } }

/* header */
.chrome { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; justify-content: space-between; padding-block: 18px 0; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { color: var(--accent); flex: none; }
.brand h1 { font-size: 24px; font-weight: 680; font-variation-settings: "opsz" 48; }
.status { color: var(--ink-3); font-size: 13px; margin-top: 2px; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-top: 14px; }
.tabs::-webkit-scrollbar { display: none; }
.sg-public .tabs, .sg-public #runNow { display: none !important; }
.sg-public .chrome { padding-bottom: 12px; }
.pub-only { display: none !important; }
.sg-public .pub-only { display: inline-flex !important; }
.tab { appearance: none; background: none; border: 0; padding: 10px 12px 11px; font-weight: 560; color: var(--ink-2); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font: 500 11.5px/1 var(--mono); padding: 3px 6px; border-radius: 99px; background: var(--line-2); color: var(--ink-2); }
.count.hot { background: var(--bloom-soft); color: var(--bloom); }
.count:empty { display: none; }
@media (max-width: 640px), (max-height: 560px) { .chrome { position: static; } }

main { padding-top: 24px; }
.banner { margin-top: 16px; padding: 12px 14px; border-radius: var(--r); background: var(--bloom-soft); color: var(--ink); font-size: 14px; }

/* buttons */
.btn { appearance: none; border: 1px solid var(--line); background: var(--raised); color: var(--ink); border-radius: 8px; padding: 8px 14px; font-weight: 560; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; line-height: 1.2; transition: background .15s, border-color .15s; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); background: var(--line-2); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.link { appearance: none; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 560; cursor: pointer; font-size: 14px; }
.link:hover { text-decoration: underline; }

/* chips + pills */
.chip { --h: 160; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 99px; color: hsl(var(--h) 45% var(--tl)); background: hsl(var(--h) 50% var(--tbg)); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.bloom { background: var(--bloom-soft); color: var(--bloom); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; margin-bottom: 16px; }
.section-head h2 { font-size: 26px; font-weight: 650; font-variation-settings: "opsz" 40; }
.section-head p { color: var(--ink-2); max-width: 62ch; margin-top: 4px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { appearance: none; border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 4px 11px; font-size: 13px; font-weight: 550; color: var(--ink-2); cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }

.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 36px 24px; text-align: left; color: var(--ink-2); background: var(--surface); }
.empty h3 { font-size: 19px; color: var(--ink); margin-bottom: 6px; }
.empty p { max-width: 58ch; }
.empty .steps { margin: 14px 0 0; padding-left: 20px; display: grid; gap: 4px; }

/* review */
.summary-strip { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline; padding: 14px 0 18px; border-bottom: 1px solid var(--line-2); margin-bottom: 18px; }
.big { font: 650 40px/1 var(--display); font-variation-settings: "opsz" 72; color: var(--ink); }
.cands { display: grid; gap: 16px; }
.cand { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0; }
.cand.done { box-shadow: none; background: var(--surface); }
.cand-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.cand-head .when { margin-left: auto; color: var(--ink-3); }
.cand h3 { font-size: 19px; }
.cand .summary { color: var(--ink-2); max-width: 70ch; }
.trial { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface); }
.marks { display: inline-flex; gap: 5px; }
.mark { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 11px/1 var(--mono); }
.mark.w { background: var(--good); color: var(--raised); }
.mark.l { background: var(--bad-soft); color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.mark.t { background: var(--line-2); color: var(--ink-2); }
.trial-text { font-size: 14px; }
.advice { display: grid; gap: 4px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); max-width: 72ch; }
.advice-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--ink-3); }
.advice p { font-size: 14px; color: var(--ink-2); margin: 0; }
.why { font-size: 14px; color: var(--ink-2); max-width: 72ch; }
.pub { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 14px 16px; margin-bottom: 18px; display: grid; gap: 8px; }
.pub-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.pub-row p { margin: 0; flex: 1 1 320px; font-size: 14px; color: var(--ink-2); }
.pub-row p strong { color: var(--ink); }
.pub .notes { margin: 0; }
.pub pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 var(--mono); color: var(--bad); }
.why strong { color: var(--ink); font-weight: 600; }
.notes { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 3px; }
.sources { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; margin: 0; padding: 0; list-style: none; }
.sources li { display: inline-flex; gap: 6px; align-items: baseline; min-width: 0; }
.sources .k { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.sources a { overflow-wrap: anywhere; }
.cand-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cand-actions .link { margin-left: auto; }
.lost-toggle { margin-top: 26px; }

/* diff */
.diff { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font: 12.5px/1.55 var(--mono); background: var(--surface); }
.diff .row { display: grid; grid-template-columns: 22px 1fr; }
.diff .row span:first-child { text-align: center; color: var(--ink-3); user-select: none; }
.diff .row span:last-child { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 10px; min-width: 0; }
.diff .add { background: var(--add); }
.diff .del { background: var(--del); }
.diff .gap { padding: 4px 10px; color: var(--ink-3); background: var(--line-2); font-size: 12px; }
.diff-legend { font-size: 12.5px; color: var(--ink-3); }

/* skills */
.grid-topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.topic-card { text-align: left; appearance: none; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 18px; cursor: pointer; display: grid; gap: 12px; align-content: start; box-shadow: var(--shadow); min-width: 0; transition: border-color .15s, transform .15s; }
.topic-card:hover { border-color: var(--ink-3); }
.topic-card.off { opacity: .6; }
.tc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ver { font: 650 26px/1 var(--display); font-variation-settings: "opsz" 60; color: var(--ink); }
.ver small { font: 500 12px var(--mono); color: var(--ink-3); margin-right: 3px; }
.topic-card h3 { font-size: 20px; }
.topic-card p { color: var(--ink-2); font-size: 14px; }
.gens { display: grid; gap: 5px; }
.gens-row { display: flex; flex-wrap: wrap; gap: 3px; }
.gen { width: 11px; height: 11px; border-radius: 3px; background: var(--accent-soft); }
.gen.now { background: var(--accent); }
.gens .lbl, .meta dt { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.meta { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 0; padding-top: 12px; border-top: 1px solid var(--line-2); }
.meta dd { margin: 2px 0 0; font-size: 14px; font-weight: 560; }
.meta dd.hot { color: var(--bloom); }
.add-card { border: 1.5px dashed var(--line); background: transparent; box-shadow: none; color: var(--ink-2); place-content: center; min-height: 200px; text-align: center; }
.add-card strong { font: 620 18px var(--display); color: var(--ink); display: block; }
.form-card { cursor: default; }

.detail-head { display: grid; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid var(--line-2); }
.detail-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.detail-title h2 { font-size: 30px; font-weight: 660; font-variation-settings: "opsz" 60; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.subtabs { display: flex; gap: 4px; margin: 16px 0 20px; flex-wrap: wrap; }
.subtab { appearance: none; border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-weight: 560; color: var(--ink-2); cursor: pointer; }
.subtab[aria-selected="true"] { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

.reader { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 26px 30px 30px; max-width: 820px; min-width: 0; }
@media (max-width: 520px) { .reader { padding: 18px 16px 22px; } }
.reader .lead { font-size: 16px; color: var(--ink-2); padding-bottom: 16px; margin-bottom: 18px; border-bottom: 1px solid var(--line-2); max-width: 66ch; }
.reader h2 { font-size: 22px; margin: 26px 0 8px; }
.reader h2:first-child { margin-top: 0; }
.reader h3 { font-size: 17px; margin: 20px 0 6px; }
.reader h4 { font-size: 15px; margin: 16px 0 4px; }
.reader p { margin: 8px 0; max-width: 68ch; }
.reader ul, .reader ol { margin: 8px 0; padding-left: 22px; max-width: 68ch; }
.reader li { margin: 3px 0; }
.reader li.check { list-style: none; margin-left: -20px; display: flex; gap: 8px; }
.reader li.check::before { content: ""; flex: none; width: 13px; height: 13px; margin-top: 5px; border: 1.5px solid var(--ink-3); border-radius: 3px; }
.reader code { font-family: var(--mono); font-size: .88em; background: var(--surface); border: 1px solid var(--line-2); padding: 0 4px; border-radius: 4px; }
.reader pre { font: 12.5px/1.6 var(--mono); background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 10px 0; }
.reader pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.tw { overflow-x: auto; margin: 10px 0; }
.reader table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.reader th, .reader td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.reader th { font-weight: 620; font-size: 13px; color: var(--ink-2); border-bottom-color: var(--line); }
.raw { width: 100%; min-height: 420px; font: 13px/1.6 var(--mono); padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); resize: vertical; }

.hist { display: grid; gap: 0; border-left: 2px solid var(--line); margin-left: 10px; max-width: 820px; }
.hist-item { position: relative; padding: 0 0 20px 22px; display: grid; gap: 6px; min-width: 0; }
.hist-item::before { content: ""; position: absolute; left: -7px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--raised); border: 2px solid var(--accent); }
.hist-item.now::before { background: var(--accent); }
.hist-top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.hist-top strong { font: 640 16px var(--display); }

.tests { display: grid; gap: 12px; max-width: 820px; }
.test { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.test .lbl { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }

.fields { display: grid; gap: 14px; max-width: 820px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--ink-3); }
.input, .select, .area { width: 100%; border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 9px 11px; font-size: 14.5px; min-width: 0; }
.area { min-height: 90px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .area:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.kv { display: grid; gap: 10px; }
.kv .taglist { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; padding: 3px 9px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line-2); overflow-wrap: anywhere; }

/* inbox */
.inbox-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; margin-bottom: 28px; }
@media (max-width: 820px) { .inbox-top { grid-template-columns: minmax(0, 1fr); } }
.scout-add { max-width: 640px; margin-bottom: 24px; }
.panel { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel h3 { font-size: 18px; }
.panel .sub { color: var(--ink-2); font-size: 14px; }
.panel p.sub { display: block; padding: 0; border-bottom: 0; background: none; }   /* not the sub-skill row of the same name */
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 6px; justify-items: start; cursor: pointer; background: var(--surface); transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { font-weight: 620; }
.steps-mini { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 2px; }
.map-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.map-table th, .map-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.map-table th { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.map-table td.num { font-family: var(--mono); font-size: 13px; }
.progress { height: 6px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

.colls { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-bottom: 30px; }
.coll { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--raised); display: grid; gap: 8px; min-width: 0; }
.coll-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.coll-top strong { font: 620 16px var(--display); overflow-wrap: anywhere; }
.coll-top .n { font: 650 22px/1 var(--display); }
.creators { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.bars svg { display: block; width: 100%; height: 54px; overflow: visible; }
.bars .axis { font: 10.5px var(--mono); fill: var(--ink-3); }

.reels { list-style: none; margin: 0; padding: 0; display: grid; }
.reel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid var(--line-2); }
.reel:first-child { border-top: 1px solid var(--line-2); }
.r-main { display: grid; gap: 4px; min-width: 0; }
.r-line { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.r-owner { font-weight: 620; overflow-wrap: anywhere; }
.r-coll { font-size: 13px; color: var(--ink-3); }
.r-text { font-size: 14px; color: var(--ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.r-find { font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--surface); overflow-wrap: anywhere; }
.r-find b { font-weight: 620; }
.r-side { display: grid; justify-items: end; align-content: start; gap: 6px; }
.r-side .row-actions { justify-content: flex-end; }
@media (max-width: 560px) { .reel { grid-template-columns: minmax(0,1fr); } .r-side { justify-items: start; } .r-side .row-actions { justify-content: flex-start; } }
.note-edit { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.note-edit .input { flex: 1 1 240px; }

.add-modes { margin-bottom: 2px; }
.r-frames { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; }
.r-frames img { width: 64px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line-2); flex: none; }
.r-media { font-size: 13px; color: var(--ink-3); }
.r-media.bad { color: var(--bad); }
.conflicts { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; background: var(--surface); }
.conflicts h4 { font-size: 14px; font-weight: 640; }
.conflicts ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.conflicts li { font-size: 13.5px; color: var(--ink-2); display: grid; gap: 2px; }
.conflicts li b { color: var(--ink); font-weight: 620; }

/* log */
.runs { display: grid; gap: 14px; max-width: 860px; }
.run { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.run-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.run-head strong { font: 640 17px var(--display); }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13.5px; color: var(--ink-2); }
.stats b { font: 600 14px var(--mono); color: var(--ink); margin-right: 4px; }
.pt { border-collapse: collapse; font-size: 13.5px; }
.pt td, .pt th { padding: 4px 16px 4px 0; text-align: left; }
.pt th { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.pt td.num { font-family: var(--mono); }
.blocked { font-size: 13.5px; color: var(--ink-2); padding: 8px 10px; border-radius: 8px; background: var(--bloom-soft); }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 560; font-size: 14px; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--raised); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(16px); }
.skip-why { display: grid; gap: 4px; flex: 1 1 260px; font-size: 13px; color: var(--ink-2); }
.radar { max-width: 860px; background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 12px; margin-bottom: 14px; min-width: 0; }
.rd-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 22px; }
.rd-col { min-width: 0; }
.rd-col h4 { font-size: 13px; color: var(--ink-3); font-weight: 600; margin: 0 0 6px; }
.rd-col ol { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; }
.rd-col li { overflow-wrap: anywhere; }
.rd-col li .muted { display: block; font-size: 12px; }
.scout-setup { border: 1px solid var(--line); border-radius: 12px; background: var(--raised); padding: 16px; margin-bottom: 24px; display: grid; gap: 14px; }
.scout-setup .ss-row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; }
.scout-setup .field { min-width: 180px; flex: 0 1 240px; }
.scout-setup .ss-note { color: var(--ink-2); font-size: 13px; flex: 1 1 260px; }
.scout-setup .ss-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.scout-setup .ss-head strong { margin-right: auto; }
.ss-topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; }
.ss-topics label { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; min-width: 0; }
.ss-topics label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plugin-list { margin: 0 0 18px; }
.plugin-list summary { cursor: pointer; }
.plugin-list h4 { margin: 14px 0 6px; font-size: 13px; color: var(--ink-3); font-weight: 600; }
.ss-topics input { accent-color: var(--accent); width: 16px; height: 16px; flex: none; margin: 0; }
.howto { max-width: 860px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line-2); color: var(--ink-2); font-size: 14px; display: grid; gap: 8px; }
.howto h3 { font-size: 17px; color: var(--ink); }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(520px, calc(100vw - 32px)); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); color: #fff; }
.skeleton { color: var(--ink-3); padding: 30px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------- product shell ---------- */
.app { max-width: 1240px; }
.chrome { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); margin-inline: -20px; padding-inline: 20px; border-bottom: 1px solid var(--line-2); }
@media (max-width: 520px) { .chrome { margin-inline: -16px; padding-inline: 16px; } }
.top { padding-block: 14px 0; }
.brand { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; }
.brand h1 { font-size: 21px; }
.brand .status { font-size: 12.5px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); }
.brand-mark svg { width: 22px; height: 22px; }
.brand-mark .sway { transform-origin: 16px 29px; animation: sway 6s var(--ease) infinite alternate; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.tabs { border-bottom: 0; margin-top: 8px; }
.top-actions { gap: 6px; }
.search-btn { appearance: none; display: inline-flex; align-items: center; gap: 10px; min-width: 220px; padding: 7px 8px 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); color: var(--ink-3); font-size: 14px; cursor: pointer; transition: border-color .15s var(--ease); }
.search-btn:hover { border-color: var(--ink-3); color: var(--ink-2); }
.search-btn span { flex: 1; text-align: left; }
kbd { font: 500 11px/1 var(--mono); padding: 3px 5px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
@media (max-width: 640px) { .search-btn { min-width: 0; } .search-btn span, .search-btn kbd { display: none; } }
.icon-btn { appearance: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); color: var(--ink-2); cursor: pointer; position: relative; }
.icon-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn .dot { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font: 600 11px/18px var(--mono); text-align: center; }
.icon-btn .dot:empty { display: none; }
.btn { transition: background .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease); }
.btn:active { transform: scale(.97); }
.eyebrow { font: 560 13px/1.35 var(--body); color: var(--ink-3); }

/* ---------- explore: hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: 28px; align-items: stretch; margin: 8px 0 30px; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero-copy { display: grid; align-content: center; gap: 18px; padding: 10px 0; }
.hero h2, .hero h1 { font-size: clamp(34px, 5vw, 56px); line-height: 1.02; font-weight: 640; letter-spacing: -.025em; font-variation-settings: "opsz" 96; max-width: 15ch; }
.hero .lede { font-size: 17px; color: var(--ink-2); max-width: 52ch; }
.hero-ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.btn.lg { padding: 11px 18px; font-size: 15px; border-radius: 10px; }
.hero-stats { color: var(--ink-2); font-size: 14.5px; }
.hero-stats b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.hero-art { position: relative; min-height: 380px; border-radius: 18px; border: 1px solid var(--line); background: radial-gradient(120% 90% at 50% 100%, var(--accent-soft), transparent 62%), var(--raised); overflow: hidden; box-shadow: var(--shadow); }
.hero-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.garden-cap { position: absolute; left: 16px; top: 14px; right: 16px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
.garden-cap strong { font: 620 16px var(--display); display: block; }
.garden-cap .eyebrow { display: block; margin-bottom: 2px; }
.garden-cap .r { text-align: right; }

.ex-sec { margin: 0 0 34px; display: grid; gap: 14px; }
.ex-sec > header h2 { font-size: 22px; }
.ex-sec > header p { color: var(--ink-2); font-size: 14px; max-width: 70ch; }
.chain-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.chain-card { text-align: left; font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: var(--raised); display: grid; gap: 8px; min-width: 0; transition: border-color .15s, transform .15s; }
.chain-card:hover { border-color: var(--accent); }
.chain-card h3 { font-size: 18px; }
.chain-card p { color: var(--ink-2); font-size: 14px; }
.chain-path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.chain-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: st; }
.chain-steps li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--line-2); counter-increment: st; }
.chain-steps li::before { content: counter(st, decimal-leading-zero); font: 600 13px var(--mono); color: var(--ink-3); padding-top: 3px; }
.chain-steps h4 { font-size: 16px; font-weight: 640; }
.chain-steps p { color: var(--ink-2); font-size: 14px; }
.chain-steps .caps { margin-top: 4px; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.feed li, .credits li { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line-2); min-width: 0; }
.feed .r-line b, .credits .r-line b { font-weight: 620; }
.credit-links { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; }
.credit-links a, .credit-links span { overflow-wrap: anywhere; }
.credits { list-style: none; margin: 0; padding: 0; }

.ex-bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 10px 0; }
.ex-bar h2 { font-size: 24px; }
.ex-search { flex: 0 1 300px; position: relative; }
.ex-search input { width: 100%; padding: 8px 12px 8px 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); font-size: 14px; }
.ex-search input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.ex-search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 15px; height: 15px; color: var(--ink-3); }
.cat-row { display: flex; flex-wrap: wrap; gap: 6px; }
.bed + .bed { margin-top: 30px; }
.bed > h3 { font-size: 17px; font-weight: 640; margin-bottom: 12px; display: flex; align-items: baseline; gap: 10px; }
.bed > h3 span { font: 400 13.5px var(--body); color: var(--ink-3); }

/* topic cards */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
.tcard { --h: 165; appearance: none; text-align: left; position: relative; display: grid; gap: 10px; align-content: start; padding: 18px 18px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--raised); cursor: pointer; color: inherit; min-width: 0; overflow: hidden; transition: transform .25s var(--ease), border-color .2s var(--ease), box-shadow .25s var(--ease); }
@media (hover: hover) { .tcard:hover { transform: translateY(-2px); border-color: hsl(var(--h) 40% 55% / .6); box-shadow: var(--shadow-lg); } }
.tcard:active { transform: none; }
.tc-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
.tc-head i { width: 9px; height: 9px; border-radius: 50%; background: hsl(var(--h) 55% 50%); flex: none; }
.tcard h3 { font-size: 19px; }
.tcard p { color: var(--ink-2); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tc-top { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line-2); display: grid; gap: 3px; font-size: 13.5px; }
.tc-top li { display: flex; gap: 8px; min-width: 0; }
.tc-top li span { flex: none; width: 1.2em; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tc-top li b { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tc-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--ink-3); }
.foot-note { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line-2); color: var(--ink-3); font-size: 13px; max-width: 80ch; }

/* ---------- topic page ---------- */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink-3); margin-bottom: 14px; }
.crumbs button { appearance: none; border: 0; background: none; padding: 0; color: var(--ink-2); cursor: pointer; font-weight: 560; }
.crumbs button:hover { color: var(--accent); }
/* On the website these are real links (crawlable, open in a new tab); they look like the buttons they replace. */
a.tcard, a.chain-card, a.gitem, a.cap, a.link, .crumbs a { text-decoration: none; }
a.gitem, a.cap { color: var(--ink); }
.crumbs a { color: var(--ink-2); font-weight: 560; } .crumbs a:hover { color: var(--accent); }
/* A pre-rendered page is taken over without replaying the entrance animations. */
.pre .reveal { animation: none; }
.t-hero { --h: 165; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 30px; align-items: end; padding: 22px 0 22px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
@media (max-width: 760px) { .t-hero { grid-template-columns: minmax(0, 1fr); } }
.t-hero h2, .t-hero h1 { font-size: clamp(32px, 4.4vw, 46px); letter-spacing: -.02em; font-weight: 650; font-variation-settings: "opsz" 96; margin: 6px 0 8px; }
.t-hero .lede { color: var(--ink-2); font-size: 16px; max-width: 60ch; }
.t-stats { display: flex; gap: 22px; }
.t-stats div { display: grid; }
.t-stats b { font: 620 28px/1 var(--display); font-variant-numeric: tabular-nums; }
.t-stats span { font-size: 13px; color: var(--ink-3); margin-top: 4px; }

.super { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 16px; background: var(--raised); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 34px; }
@media (max-width: 900px) { .super { grid-template-columns: minmax(0, 1fr); } }
.super-main { padding: 22px 24px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.super-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font: 620 12.5px/1 var(--body); padding: 5px 9px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); }
.super-lead { font-size: 15.5px; line-height: 1.5; color: var(--ink); max-width: 58ch; text-wrap: pretty; }
.guides h4 { display: flex; align-items: center; gap: 8px; font: 620 15px var(--display); margin-bottom: 8px; }
.glist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
.gitem { appearance: none; width: 100%; height: 100%; min-height: 44px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px 9px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 540; line-height: 1.35; cursor: pointer; transition: border-color .15s var(--ease), background .15s var(--ease); }
.gitem svg { flex: none; color: var(--ink-3); transition: transform .15s var(--ease), color .15s var(--ease); }
@media (hover: hover) { .gitem:hover { border-color: var(--accent); background: var(--accent-soft); } .gitem:hover svg { color: var(--accent); transform: translateX(2px); } }
.when summary { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-size: 13.5px; font-weight: 560; color: var(--ink-2); border-radius: 6px; }
.when summary::-webkit-details-marker { display: none; }
.when summary::before { content: ""; width: 6px; height: 6px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: rotate(-45deg); transition: transform .15s var(--ease); }
.when[open] summary::before { transform: rotate(45deg); }
@media (hover: hover) { .when summary:hover { color: var(--ink); } }
.when p { margin-top: 8px; font-size: 13.5px; color: var(--ink-2); max-width: 70ch; }
.caps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.cap { appearance: none; text-align: left; display: flex; gap: 9px; align-items: center; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 13.5px; font-weight: 540; cursor: pointer; min-width: 0; transition: border-color .15s var(--ease), background .15s var(--ease); }
.cap:hover { border-color: var(--accent); background: var(--accent-soft); }
.cap i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.cap span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.install { padding: 22px 24px; background: var(--surface); border-left: 1px solid var(--line); display: grid; gap: 12px; align-content: start; min-width: 0; }
@media (max-width: 900px) { .install { border-left: 0; border-top: 1px solid var(--line); } }
.install h4 { font: 620 15px var(--display); }
.seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--line-2); gap: 2px; }
.seg button { appearance: none; border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-size: 13px; font-weight: 560; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 2px oklch(0 0 0 / .12); }
.code { position: relative; font: 12.5px/1.6 var(--mono); background: var(--ink); color: var(--ground); border-radius: 9px; padding: 11px 58px 11px 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.i-step { font-size: 13.5px; color: var(--ink-2); margin-bottom: -4px; }
.i-note { font-size: 13px; color: var(--ink-3); }
.code .cp { position: absolute; right: 6px; top: 6px; appearance: none; border: 1px solid oklch(0.6 0 0 / .4); border-radius: 6px; padding: 3px 7px; font: 500 11px var(--mono); background: var(--ink); color: inherit; cursor: pointer; }
.install ol { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 6px; }
.try { display: grid; gap: 6px; }
.try q { display: block; font-size: 13.5px; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--line); color: var(--ink-2); quotes: none; }

/* specimen tag: provenance label for every skill */
.specimen { display: inline-flex; align-items: center; gap: 7px; font: 500 11.5px/1 var(--mono); padding: 4px 8px 4px 6px; border: 1px solid var(--line); border-radius: 4px 7px 7px 4px; background: var(--surface); color: var(--ink-2); max-width: 100%; min-width: 0; }
.specimen::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--ink-3); }
.specimen b { font-weight: 600; color: var(--ink); }
.specimen span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.specimen.lock { border-style: dashed; }
.pol-tag { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--body); padding: 4px 8px; border-radius: 99px; background: var(--bloom-soft); color: var(--bloom); }
.pol-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--pollen); box-shadow: 0 0 0 3px oklch(0.85 0.15 90 / .25); }

.subs-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; margin-bottom: 12px; }
.subs-head h3 { font-size: 22px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
  "use strict";

  /* ---------- state ---------- */
  const S = {
    db: null, user: null, mcp: null, downloads: null, canWrite: true,
    loaded: { topics: false, candidates: false, inbox: false, runs: false, settings: false, radar: false },
    topics: [], candidates: [], inbox: [], runs: [], settings: null, radar: null, versions: [], versionsFor: null,
    view: "explore", reviewTopic: "all", reviewTab: "waiting", revoking: null, openDiff: new Set(), busy: new Set(),
    skillOpen: null, skillTab: "skill", skillRaw: false, editing: null, newTopicOpen: false, histOpen: new Set(),
    inboxTopic: "all", inboxStatus: "all", inboxLimit: 150, noteEditing: null,
    importState: null, // {stage:'map'|'writing'|'done', items, colls, recentDays, done, total, error}
    manualStartedAt: 0,
    addMode: "links", media: null, mediaTools: null,
  };
  let unsubVersions = null;

  /* ---------- helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => { try { const x = new URL(String(u)); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; } catch { return null; } };
  const iso = () => new Date().toISOString();
  const topicById = (id) => S.topics.find((t) => t.id === id);
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;
  const N = (x) => Number(x) || 0;
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };

  function ago(t) {
    if (!t) return "";
    const d = new Date(t); if (isNaN(d)) return "";
    const s = (Date.now() - d.getTime()) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)} min ago`;
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
    if (s < 172800) return "yesterday";
    if (s < 86400 * 14) return `${Math.floor(s / 86400)} days ago`;
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  }
  const fmtDay = (t) => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }); };
  const fmtTime = (t) => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); };
  const fmtShort = (t) => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "2-digit" }); };

  function chip(t) {
    if (!t) return `<span class="chip" style="--h:150">No topic</span>`;
    return `<span class="chip" style="--h:${Number(t.hue) || 150}">${esc(t.name)}</span>`;
  }

  let toastTimer = 0;
  function toast(msg, kind) {
    const el = $("#toast");
    el.textContent = msg;
    el.className = "toast show" + (kind === "bad" ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = "toast"; }, 4200);
  }
  function errMsg(e) {
    switch (e && e.code) {
      case "invalid_argument": return "Couldn't save. You may only have view access to this page.";
      case "quota_exceeded": return "The garden's storage is full. Remove old reels to make room.";
      case "resource_exhausted": return "Too many saves at once. Wait a moment and try again.";
      case "revoked": return "Access to this page changed. Reload to continue.";
      case "tool_error": return e.message || "That didn't work. Try again.";
      default: return "Couldn't save just now. Try again in a moment.";
    }
  }
  async function guarded(key, fn) {
    if (S.busy.has(key)) return;
    S.busy.add(key); render();
    try { await fn(); } catch (e) { toast(errMsg(e), "bad"); }
    finally { S.busy.delete(key); render(); }
  }
  const dis = (key) => (S.busy.has(key) || !S.canWrite ? " disabled" : "");

  /* Weekly schedule, on settings.scoutTz's clock (the Mac's local scheduler reads the same settings) */
  function zoned(tz, at = new Date()) {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(at).map((x) => [x.type, x.value]));
    return { y: +p.year, m: +p.month, d: +p.day, h: +p.hour, mi: +p.minute };
  }
  function nextScout() {
    const s = S.settings || {}, tz = s.scoutTz || "Europe/Berlin", t = s.scoutTime || "22:00";
    const [hh, mm] = t.split(":").map(Number);
    const n = zoned(tz);
    const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const day = DAYS.indexOf(s.scoutDay || "Sat");
    const today = new Date(Date.UTC(n.y, n.m - 1, n.d)).getUTCDay();
    let ahead = (day - today + 7) % 7;
    if (ahead === 0 && n.h * 60 + n.mi >= hh * 60 + mm) ahead = 7;
    // The run's wall-clock time in tz as a real instant: guess it as UTC, then correct by tz's offset then.
    const guess = Date.UTC(n.y, n.m - 1, n.d + ahead, hh, mm), g = zoned(tz, new Date(guess));
    const at = new Date(guess - (Date.UTC(g.y, g.m - 1, g.d, g.h, g.mi) - guess));
    const city = tz.split("/").pop().replace(/_/g, " ");
    const local = Intl.DateTimeFormat().resolvedOptions().timeZone !== tz ? ` (${fmtTime(at)} your time)` : "";
    const when = ahead === 0 ? "today" : ahead === 1 ? "tomorrow" : ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][day];
    return `${when} ${t} ${city} time${local}`;
  }

  /* ---------- markdown (small, safe) ---------- */
  function inline(src) {
    return String(src).split(/(`[^`]+`)/g).map((part) => {
      if (/^`[^`]+`$/.test(part)) return `<code>${esc(part.slice(1, -1))}</code>`;
      let s = esc(part);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
      s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) => {
        const u = safeUrl(url.replace(/&amp;/g, "&"));
        return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${text}</a>` : text;
      });
      return s;
    }).join("");
  }
  function splitFront(src) {
    const m = String(src || "").match(/^---\n([\s\S]*?)\n---\n?/);
    if (!m) return { meta: {}, body: String(src || "") };
    const meta = {};
    for (const line of m[1].split("\n")) { const k = line.match(/^([A-Za-z_-]+):\s*(.*)$/); if (k) meta[k[1]] = k[2].replace(/^["']|["']$/g, ""); }
    return { meta, body: String(src).slice(m[0].length) };
  }
  function md(src) {
    const lines = String(src).split("\n");
    const out = [];
    let i = 0;
    const isTable = (l) => /^\s*\|.*\|\s*$/.test(l);
    const isList = (l) => /^\s*([-*]|\d+\.)\s+/.test(l);
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
        continue;
      }
      const h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) { const lv = Math.min(4, h[1].length + 1); out.push(`<h${lv}>${inline(h[2])}</h${lv}>`); i++; continue; }
      if (isTable(line)) {
        const rows = [];
        while (i < lines.length && isTable(lines[i])) rows.push(lines[i++]);
        const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
        const body = rows.filter((r) => !/^[\s|:-]+$/.test(r));
        const [head, ...rest] = body;
        out.push(`<div class="tw"><table><thead><tr>${cells(head).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rest.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
        continue;
      }
      if (isList(line)) {
        const ordered = /^\s*\d+\./.test(line);
        const items = [];
        while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
          if (isList(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
          else items[items.length - 1] += " " + lines[i].trim();
          i++;
        }
        out.push(`<${ordered ? "ol" : "ul"}>${items.map((it) => {
          const c = it.match(/^\[( |x|X)\]\s+(.*)$/);
          return c ? `<li class="check">${inline(c[2])}</li>` : `<li>${inline(it)}</li>`;
        }).join("")}</${ordered ? "ol" : "ul"}>`);
        continue;
      }
      if (!line.trim()) { i++; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```)/.test(lines[i]) && !isTable(lines[i]) && !isList(lines[i])) buf.push(lines[i++]);
      out.push(`<p>${inline(buf.join(" "))}</p>`);
    }
    return out.join("\n");
  }

  /* ---------- line diff ---------- */
  function diffLines(a, b) {
    const A = String(a || "").split("\n"), B = String(b || "").split("\n");
    let pre = 0; while (pre < A.length && pre < B.length && A[pre] === B[pre]) pre++;
    let suf = 0; while (suf < A.length - pre && suf < B.length - pre && A[A.length - 1 - suf] === B[B.length - 1 - suf]) suf++;
    const a2 = A.slice(pre, A.length - suf), b2 = B.slice(pre, B.length - suf);
    const n = a2.length, m = b2.length;
    const ops = [];
    for (let k = 0; k < pre; k++) ops.push([" ", A[k]]);

      }
      while (x < n) ops.push(["-", a2[x++]]);
      while (y < m) ops.push(["+", b2[y++]]);

  function monthBins(items) {
    const now = new Date(); const bins = [];
    for (let k = 11; k >= 0; k--) { const d = new Date(now.getFullYear(), now.getMonth() - k, 1); bins.push({ y: d.getFullYear(), m: d.getMonth(), n: 0, label: d.toLocaleDateString(undefined, { month: "short", year: "numeric" }) }); }
    for (const r of items) { const d = new Date(r.savedAt || r.addedAt); if (isNaN(d)) continue; const b = bins.find((x) => x.y === d.getFullYear() && x.m === d.getMonth()); if (b) b.n++; }
    return bins;
  }
  function barsSvg(bins) {
    const W = 240, H = 40, gap = 2, bw = (W - gap * 11) / 12, max = Math.max(1, ...bins.map((b) => b.n));
    const bars = bins.map((b, k) => {
      const x = k * (bw + gap), h = b.n ? Math.max(3, (b.n / max) * H) : 0, y = H - h, r = Math.min(4, bw / 2, h);
      const path = h ? `M${x},${H}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${H}Z` : "";
      return `<g><title>${esc(b.label)} · ${plural(b.n, "save")}</title><rect x="${x}" y="0" width="${bw + gap}" height="${H}" fill="transparent"/>${path ? `<path d="${path}" fill="var(--accent)"/>` : ""}</g>`;
    }).join("");
    return `<svg viewBox="0 -2 ${W} ${H + 16}" role="img" aria-label="Saves per month, last 12 months">${bars}<line x1="0" x2="${W}" y1="${H + .5}" y2="${H + .5}" stroke="var(--line)"/><text class="axis" x="0" y="${H + 13}">${esc(bins[0].label)}</text><text class="axis" x="${W}" y="${H + 13}" text-anchor="end">${esc(bins[11].label)}</text></svg>`;
  }

  const POST_RE = /https?:\/\/(?:www\.)?instagram\.com\/(?:[A-Za-z0-9_.]+\/)?(p|reels?|tv)\/([A-Za-z0-9_-]{5,})/g;

  async function readImportFile(file) {

        if (!window.JSZip) throw new Error("The zip reader didn't load. Unzip the file and choose saved_collections.json instead.");
        const zip = await window.JSZip.loadAsync(file);

  function guessTopic(name) {

    for (const t of S.topics) { const words = String(t.name).toLowerCase().split(/\s+/).filter((w) => w.length > 3); if (words.some((w) => n.includes(w.slice(0, 5)))) return t.id; }

  async function doImport() {
    const st = S.importState; if (!st || st.stage !== "map") return;
    const existing = new Set(S.inbox.map((r) => r.id));
    const cut = Date.now() - st.recentDays * 86400e3;
    const now = iso();
    const rows = st.items.map((it) => {
      const topicId = st.map[it.collection] || null;
      const recent = st.recentDays === 0 || new Date(it.savedAt || 0).getTime() >= cut;
      return { id: "ig-" + it.code, data: { url: it.url, shortcode: it.code, kind: it.kind, owner: it.owner || "", collection: it.collection, collections: it.collections, topicId, note: "", caption: it.caption || "", savedAt: it.savedAt || "", addedAt: now, via: "export", status: topicId && recent ? "new" : "library" } };
    });
    const fresh = rows.filter((r) => !existing.has(r.id));
    S.importState = { ...st, stage: "writing", done: 0, total: fresh.length }; renderImport();
    let k = 0, failed = 0;
    const worker = async () => {
      while (k < fresh.length) {
        const r = fresh[k++];
        try { await S.db.doc("inbox/" + r.id).set(r.data); }
        catch (e) {
          if (e && e.code === "quota_exceeded") { failed = fresh.length; k = fresh.length; toast(errMsg(e), "bad"); break; }
          await new Promise((res) => setTimeout(res, 1200 + Math.random() * 800));
          try { await S.db.doc("inbox/" + r.id).set(r.data); } catch { failed++; }
        }
        S.importState.done++;
        if (S.importState.done % 10 === 0 || S.importState.done === fresh.length) renderImport();
      }

    const links = {};

      const t = topicById(tid); if (!t) continue;
      const merged = [...new Set([...(t.collections || []), ...colls])];
      if (merged.length !== (t.collections || []).length) { try { await S.db.doc("topics/" + tid).update({ collections: merged }); } catch {} }
    }
    const added = fresh.length - failed;
    S.importState = { stage: "done", added, skipped: rows.length - fresh.length, queued: fresh.filter((r) => r.data.status === "new").length };

    toast(failed ? `Imported ${added}. ${failed} couldn't be saved; try the import again later.` : `Imported ${added} reels.`, failed ? "bad" : undefined);
  }

  async function approve(c) {
    const t = topicById(c.topicId);
    if (!t) { toast("That topic no longer exists.", "bad"); return; }
    const risks = risksOf(c);
    if (risks.length) { toast("Blocked for safety: " + risks.join("; ") + ".", "bad"); return; }
    if (c.kind === "sources") return applySources(c, t);
    if (c.kind === "toollist") return applyToolList(c, t);
    await guarded("c:" + c.id, async () => {
      const now = iso();
      const cur = Number(t.version) || 0;
      if (cur === Number(c.baseVersion) || c.kind === "first-draft" && !t.content) {
        const v = cur + 1;
        const files = patchedFiles(t, c);
        await S.db.doc(`versions/${t.id}--v${v}`).set({ topicId: t.id, version: v, content: c.proposed || "", ...(files ? { files } : {}), summary: c.title || "", source: "candidate", candidateId: c.id, createdAt: now });
        const patch = { version: v, content: c.proposed || "", updatedAt: now };
        if (files) patch.files = files;
        if ((!t.tests || !t.tests.length) && Array.isArray(c.tests) && c.tests.length) patch.tests = c.tests;
        if ((!t.searches || !t.searches.length) && Array.isArray(c.searches) && c.searches.length) patch.searches = c.searches;
        await S.db.doc("topics/" + t.id).update(patch);
        await S.db.doc("candidates/" + c.id).update({ status: "merged", mergedVersion: v, mergedAt: now });
        toast(`Added. ${t.name} is now v${v}.`);
      } else {
        await S.db.doc("candidates/" + c.id).update({ status: "approved", approvedAt: now });
        toast(`Approved. ${t.name} changed since this was written, so the next scout run folds it in.`);
      }
    });
  }
  // A sources change edits where the scout looks for a topic (its repos and searches), not the skill.
  // undo = true swaps adds and drops, which is how a sources change is revoked.
  function sourcesEdit(c, t, undo) {
    const p = c.sourcesPatch || {};
    const arr = (k) => (Array.isArray(p[k]) ? p[k] : []).map((x) => String(x).trim()).filter(Boolean);
    const edit = (list, gone, more) => {
      const g = new Set(gone.map((x) => x.toLowerCase()));
      const out = (list || []).filter((x) => !g.has(String(x).toLowerCase()));
      for (const x of more) if (!out.some((y) => String(y).toLowerCase() === x.toLowerCase())) out.push(x);
      return out;
    };
    const [add, drop] = undo ? ["drop", "add"] : ["add", "drop"];
    return {
      repos: edit(t.repos, arr(drop + "Repos"), arr(add + "Repos").filter((r) => REPO_OK.test(r))),
      searches: edit(t.searches, arr(drop + "Searches"), arr(add + "Searches").map((x) => x.slice(0, 200))),
      feeds: edit(t.feeds, arr(drop + "Feeds"), arr(add + "Feeds").filter(isHttps)),
    };
  }
  // A tool-list change edits topic.tools: which tools the skill should teach (the gap check and the
  // scout's tools bundle work from it). undo = true takes added tools out and puts tiers back.
  function toolsEdit(c, t, undo) {
    const p = c.toolsPatch || {}, key = (x) => String(x || "").trim().toLowerCase();
    const add = (Array.isArray(p.add) ? p.add : []).filter((x) => x && x.name && ["major", "minor"].includes(x.tier) && isHttps(String(x.docs || "")));
    const retier = (Array.isArray(p.retier) ? p.retier : []).filter((x) => x && x.name && ["major", "minor"].includes(x.tier));
    let tools = (t.tools || []).map((x) => ({ ...x }));
    if (undo) {
      const gone = new Set(add.map((x) => key(x.name)));
      tools = tools.filter((x) => !gone.has(key(x.name)));
      for (const r of retier) for (const x of tools) if (key(x.name) === key(r.name) && r.from) x.tier = r.from;
    } else {
      for (const a of add) if (!tools.some((x) => key(x.name) === key(a.name))) tools.push({ name: a.name, aliases: Array.isArray(a.aliases) ? a.aliases : [], tier: a.tier, kind: a.kind || null, docs: a.docs, why: a.why || "" });
      for (const r of retier) for (const x of tools) if (key(x.name) === key(r.name)) x.tier = r.tier;
    }
    return tools;
  }
  async function applyToolList(c, t) {
    await guarded("c:" + c.id, async () => {
      await S.db.doc("topics/" + t.id).update({ tools: toolsEdit(c, t, false) });

  // Take an added change back out. Works file by file against the versions just before and after it,
  // so changes added later stay. If a later change touched the same file, the next scout run takes it out instead.
  async function revoke(c, note) {
    const t = topicById(c.topicId);
    if (!t) { toast("That topic no longer exists.", "bad"); return; }
    const extra = note ? { revokeNote: note } : {};
    await guarded("c:" + c.id, async () => {
      const now = iso();
      if (c.kind === "toollist") {
        await S.db.doc("topics/" + t.id).update({ tools: toolsEdit(c, t, true) });
        await S.db.doc("candidates/" + c.id).update({ status: "revoked", revokedAt: now, ...extra });
        S.revoking = null; toast(`Revoked. ${t.name}'s tool list is back to how it was.`); return;
      }
      if (c.kind === "sources") {
        await S.db.doc("topics/" + t.id).update(sourcesEdit(c, t, true));
        await S.db.doc("candidates/" + c.id).update({ status: "revoked", revokedAt: now, ...extra });
        S.revoking = null; toast(`Revoked. ${t.name}'s sources are back to how they were.`); return;
      }
      const n = Number(c.mergedVersion);
      const [a, b] = n > 1 ? await Promise.all([S.db.doc(`versions/${t.id}--v${n - 1}`).get(), S.db.doc(`versions/${t.id}--v${n}`).get()]) : [];
      if (!a || !a.exists || !b.exists) { toast("Can't find the versions around this change. Bring back an earlier version from the skill's History instead.", "bad"); return; }
      const before = a.data(), after = b.data();
      let content = t.content || "";
      const files = { ...(t.files || {}) }, clash = [];
      if ((before.content || "") !== (after.content || "")) {
        if (content === (after.content || "")) content = before.content || "";
        else if (content !== (before.content || "")) clash.push("SKILL.md");
      }
      // Only the files this change touched. A version without files kept the ones before it.
      const paths = Object.keys(c.filesPatch || {});
      let bf = before.files;
      for (let k = n - 2; paths.length && !bf && k >= 1; k--) { const sn = await S.db.doc(`versions/${t.id}--v${k}`).get(); if (sn.exists) bf = sn.data().files; }
      bf = bf || {};
      const af = after.files || {};
      for (const p of paths) {
        const was = bf[p] || "", added = af[p] || "", cur = files[p] || "";
        if (was === added) continue;
        if (cur === added) files[p] = was; // removed files stay as "" (see patchedFiles)
        else if (cur !== was) clash.push(p);
      }
      if (clash.length) {
        await S.db.doc("candidates/" + c.id).update({ status: "revoking", revokeRequestedAt: now, revokeClash: clash, ...extra });
        S.revoking = null; toast(`A later change also edited ${clash.join(", ")}, so the next scout run takes this one out carefully.`); return;
      }
      const v = (Number(t.version) || 0) + 1;
      const hasFiles = paths.length > 0;
      await S.db.doc(`versions/${t.id}--v${v}`).set({ topicId: t.id, version: v, content, ...(hasFiles ? { files } : {}), summary: `Revoked: ${c.title || "a change"}`, source: "revoke", candidateId: c.id, createdAt: now });
      await S.db.doc("topics/" + t.id).update({ version: v, content, ...(hasFiles ? { files } : {}), updatedAt: now });
      await S.db.doc("candidates/" + c.id).update({ status: "revoked", revokedAt: now, revokedVersion: v, ...extra });
      S.revoking = null; toast(`Revoked. ${t.name} is now v${v}, without this change.`);
    });
  }
